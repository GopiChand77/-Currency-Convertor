<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exchango — Currency Converter</title>

  <!-- Favicon (currency emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>" />

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  MAIN CONTENT                                                            -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<main>
  <div class="converter-card" role="main" aria-label="Currency Converter">

    <!-- ── Header ─────────────────────────────────────────────────────────── -->
    <header class="card-header">
      <a href="#" class="logo-mark" aria-label="Exchango Home">
        <div class="logo-icon" aria-hidden="true">💱</div>
        <span class="logo-name">Exchango</span>
      </a>
      <button class="header-menu-btn" aria-label="Menu" title="Menu">
        <!-- Hamburger icon -->
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6"  x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </header>

    <!-- ── Body ───────────────────────────────────────────────────────────── -->
    <div class="card-body">

      <!-- Title row -->
      <div class="section-title">
        <span>Currency Converter</span>
        <button class="refresh-btn" id="refresh-btn" title="Refresh rates" aria-label="Refresh exchange rates">
          <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
          </svg>
        </button>
      </div>

      <!-- Alert area -->
      <div class="alert-area" id="alert-area" role="alert" aria-live="polite"></div>

      <!-- ── Amount Input ──────────────────────────────────────────────────── -->
      <div class="form-group">
        <label class="form-label" for="amount-input">Amount</label>
        <div class="amount-input-wrapper">
          <span class="currency-prefix">
            <span class="flag" id="amount-flag">🇺🇸</span>
            <span id="prefix-code">USD</span>
          </span>
          <input
            type="number"
            id="amount-input"
            inputmode="decimal"
            placeholder="1,000.00"
            min="0.01"
            step="any"
            aria-label="Amount to convert"
            autocomplete="off"
          />
        </div>
        <span class="error-msg" id="amount-error"></span>
      </div>

      <!-- ── From / Swap / To ──────────────────────────────────────────────── -->
      <div class="currency-row">

        <!-- From -->
        <div class="currency-col">
          <label class="form-label" for="from-currency">
            From
            <span style="font-weight:400; text-transform: none; letter-spacing:0; color: var(--text-muted); font-size:0.74rem;">Source Currency</span>
          </label>
          <div class="select-wrapper">
            <select id="from-currency" class="currency-select" aria-label="Source currency">
              <!-- Populated by JS -->
            </select>
          </div>
        </div>

        <!-- Swap button -->
        <div class="swap-btn-wrapper">
          <button id="swap-btn" class="swap-btn" aria-label="Swap currencies" title="Swap currencies">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
          </button>
        </div>

        <!-- To -->
        <div class="currency-col">
          <label class="form-label" for="to-currency">
            To
            <span style="font-weight:400; text-transform: none; letter-spacing:0; color: var(--text-muted); font-size:0.74rem;">Target Currency</span>
          </label>
          <div class="select-wrapper">
            <select id="to-currency" class="currency-select" aria-label="Target currency">
              <!-- Populated by JS -->
            </select>
          </div>
        </div>

      </div><!-- /currency-row -->

      <!-- ── Convert Button ────────────────────────────────────────────────── -->
      <button id="convert-btn" class="convert-btn" aria-label="Convert currency">
        <div class="spinner" id="spinner" role="status" aria-hidden="true"></div>
        <span id="btn-text">Convert</span>
      </button>

      <!-- ── Conversion Result ──────────────────────────────────────────────── -->
      <div id="result-block" class="result-block" aria-live="polite">
        <div class="result-label">Conversion Result</div>
        <div class="result-equation" id="result-equation">1,000.00 USD =</div>
        <div class="result-amount" id="result-amount">
          <!-- number -->
          <span id="result-currency" class="result-currency"></span>
        </div>
      </div>

      <!-- ── Exchange Rate Info ─────────────────────────────────────────────── -->
      <div id="rate-info" class="rate-info" aria-live="polite">
        <div class="rate-info-title">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path stroke-linecap="round" d="M12 8v4l3 3"/>
          </svg>
          Real-time Exchange Rate
        </div>

        <div class="rate-pill-row">
          <span class="rate-pill">
            <span id="rate-forward">1 USD = 0.9155 EUR</span>
            <span class="arrow">↗</span>
          </span>
          <span class="rate-pill">
            <span id="rate-inverse">1 EUR = 1.0923 USD</span>
            <span class="arrow">↗</span>
          </span>
        </div>

        <div class="last-updated">
          <svg width="11" height="11" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path stroke-linecap="round" d="M12 6v6l4 2"/>
          </svg>
          <span id="last-updated">Last updated: —</span>
        </div>
      </div><!-- /rate-info -->

    </div><!-- /card-body -->

    <!-- ── Bottom Navigation ───────────────────────────────────────────────── -->
    <nav class="bottom-nav" aria-label="App navigation">
      <button class="nav-item active" aria-current="page" title="Convert">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="10"/>
          <path stroke-linecap="round" d="M8 12h8M14 9l3 3-3 3"/>
        </svg>
        Convert
      </button>
      <button class="nav-item" title="Rates">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="18" height="18" rx="3"/>
          <path stroke-linecap="round" d="M8 16l3-5 3 3 3-5"/>
        </svg>
        Rates
      </button>
      <button class="nav-item" title="Charts">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Charts
      </button>
      <button class="nav-item" title="Settings">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path stroke-linecap="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Settings
      </button>
    </nav>

  </div><!-- /converter-card -->
</main>

<!-- ══════════════════════════════════════════════════════════════════════════ -->
<!--  FOOTER                                                                  -->
<!-- ══════════════════════════════════════════════════════════════════════════ -->
<footer>
  <p>
    Powered by <a href="https://www.frankfurter.app/" target="_blank" rel="noopener">Frankfurter API</a>
    (European Central Bank data) &nbsp;·&nbsp;
    Built with Express &amp; Vanilla JS &nbsp;·&nbsp;
    &copy; <span id="year"></span> Exchango
  </p>
</footer>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>

<!-- App JS -->
<script src="script.js"></script>

<!-- Year auto-fill -->
<script>document.getElementById("year").textContent = new Date().getFullYear();</script>

</body>
</html>
